<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHMSU Library · Librarian Portal Sign In</title>
  <link rel="icon" type="image/png" href="assets/chmsu-logo.png" />
  <link rel="stylesheet" href="css/librarian.css" />
  <style>
    body.chmsu-login-bg {
      min-height: 100vh;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.58), rgba(244, 247, 245, 0.66)),
        url('assets/chmsu-campus-bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .chmsu-brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      text-align: left;
    }

    .chmsu-seal {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      background: #FFFFFF;
    }

    .chmsu-brand-text .univ {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #111827;
      line-height: 1.05;
    }

    .chmsu-brand-text .sub {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #1F2937;
    }

    .chmsu-login-card {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border: 1px solid #E5E7EB;
      border-radius: 14px;
      padding: 32px 28px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
    }

    .chmsu-login-card h1 {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 4px;
    }

    .chmsu-login-card .subtitle {
      text-align: center;
      font-size: 13px;
      color: #6B7280;
      margin-bottom: 18px;
    }

    .campus-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #6B7280;
      font-size: 12px;
      margin-bottom: 18px;
    }

    .campus-divider::before,
    .campus-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #E5E7EB;
    }

    .sis-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .sis-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #D1D5DB;
      background: #EAF0FA;
      font-size: 14px;
      color: #111827;
      outline: none;
    }

    .sis-input:focus {
      border-color: #0B6B40;
      box-shadow: 0 0 0 3px rgba(11, 107, 64, 0.12);
    }

    .eye-btn {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: #6B7280;
      font-size: 15px;
      padding: 4px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .forgot-link {
      font-size: 12px;
      font-weight: 600;
      color: #111827;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-sis-login {
      width: 100%;
      padding: 11px 16px;
      border-radius: 8px;
      border: none;
      background: #0B6B40;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-sis-login:hover {
      background: #085432;
    }

    .access-row {
      text-align: center;
      font-size: 12px;
      color: #6B7280;
      margin-top: 18px;
    }

    .access-row button {
      background: none;
      border: none;
      color: #374151;
      text-decoration: underline;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }

    .login-footer {
      margin-top: 22px;
      font-size: 11px;
      color: #374151;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body class="chmsu-login-bg">
  <div class="chmsu-brand-header">
    <img src="assets/chmsu-logo.png" alt="CHMSU Logo" class="chmsu-seal" />
    <div class="chmsu-brand-text">
      <div class="univ">CARLOS HILADO</div>
      <div class="sub">MEMORIAL STATE UNIVERSITY</div>
    </div>
  </div>

  <div class="chmsu-login-card">
    <h1>Welcome back</h1>
    <p class="subtitle">CHMSU Library - Librarian Portal</p>

    <div class="campus-divider">Talisay Campus</div>

    <form id="librarian-login-form">
      <div class="form-group">
        <label class="form-label" for="email" style="color:#111827;">Librarian ID or Email</label>
        <input class="sis-input" id="email" type="text" value="ana.delacruz@chmsu.edu.ph" required />
      </div>

      <div class="form-group">
        <div class="label-row">
          <label class="form-label" for="password" style="margin-bottom:0;color:#111827;">Password</label>
          <a href="#" class="forgot-link" id="forgot-link">Forgot Password?</a>
        </div>
        <div class="sis-input-wrap">
          <input class="sis-input" id="password" type="password" placeholder="Enter your password" style="padding-right: 40px;" required />
          <button type="button" class="eye-btn" id="toggle-pw" title="Show password" aria-label="Show password">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-sis-login">
        <span>↪</span> Login
      </button>
    </form>
  </div>

  <div class="login-footer">© 2026 CHMSU Library Management System</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    function enterPortal(user) {
      localStorage.setItem('chmsu_librarian_session', JSON.stringify(user));
      window.location.href = 'analytics.html';
    }

    document.getElementById('toggle-pw').addEventListener('click', () => {
      const pw = document.getElementById('password');
      const btn = document.getElementById('toggle-pw');
      const isHidden = pw.type === 'password';
      pw.type = isHidden ? 'text' : 'password';
      btn.title = isHidden ? 'Hide password' : 'Show password';
      btn.setAttribute('aria-label', btn.title);
      btn.innerHTML = isHidden
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    });

    document.getElementById('forgot-link').addEventListener('click', (e) => {
      e.preventDefault();
      window.ChmsuApi.showToast('Contact the CHMSU Talisay Library IT administrator to reset your password.');
    });

    document.getElementById('librarian-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const client = window.ChmsuApi.getSupabaseClient();

      if (client) {
        const { data, error } = await client.auth.signInWithPassword({ email, password });
        if (error) {
          window.ChmsuApi.showToast(error.message);
          return;
        }
        const { data: profile } = await client
          .from('profiles')
          .select('full_name, role, campus')
          .eq('id', data.user.id)
          .maybeSingle();

        if (profile && profile.role !== 'librarian') {
          await client.auth.signOut();
          window.ChmsuApi.showToast('Librarian role required to access this portal.');
          return;
        }
        enterPortal({
          id: data.user.id,
          email: data.user.email,
          full_name: profile?.full_name || data.user.email,
          role: profile?.role || 'librarian',
          campus: profile?.campus || 'Talisay',
          is_supabase: true,
        });
      } else {
        const state = window.ChmsuApi.getDemoState();
        enterPortal({ ...state.librarian, email });
      }
    });
  </script>
</body>
</html>
